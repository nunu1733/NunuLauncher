  frame-03c: post-apply verification could not establish a safe current layout
expected_primary_actions:
  frame-01: begin review
  frame-02: apply or cancel after review
  frame-03a: recapture before proceeding
  frame-03b: restore or start another review
  frame-03c: inspect diagnostics before another organization change
