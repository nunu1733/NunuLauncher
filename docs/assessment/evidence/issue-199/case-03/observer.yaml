  - id: frame-01
    apparent_state: >-
      A launcher screen is covered by a prompt awaiting a choice about a proposed home-screen organization.
observations:
  - evidence_refs: [frame-01]
    visible: >-
      A dark rounded prompt occupies the lower portion of the portrait screen. Its title reads "Organize your Home screen?" and the body text explains that a proposed organization can be reviewed before confirmation.
    inference: >-
      The prompt appears to introduce a home-screen organization flow.
  - evidence_refs: [frame-01]
    visible: >-
      Three similarly sized buttons are stacked beneath the explanatory text and labeled "LATER", "SKIP", and "REVIEW ORGANIZATION".
    inference: >-
      "REVIEW ORGANIZATION" appears to be the main next-step choice because it names the review action and follows the two alternatives.
  - evidence_refs: [frame-01]
    visible: >-
      The title is visually prominent, followed by a short paragraph, then the three vertically grouped controls.
    inference: >-
      The apparent scan path is title, explanation, then choices.
  - evidence_refs: [frame-01]
    visible: >-
      The wallpaper, faint "Tap to set up" text, page indicators, and partial app icons remain visible behind the prompt.
    inference: >-
      These background elements orient the screen as a launcher home screen while remaining visually secondary to the prompt.
  - evidence_refs: [frame-01]
    visible: >-
      "LATER" and "SKIP" are separate labels, with no additional text explaining the difference between them.
    inference: >-
      The relationship between those two choices is ambiguous from this screen alone.
  - evidence_refs: [frame-01]
    visible: >-
      No proposed arrangement or preview content is shown within the captured screen.
    inference: >-
      The user is asked to choose whether to proceed before seeing the organization details.
