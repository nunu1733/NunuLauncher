evidence:
  - id: frame-01
    apparent_state: A dialog-like home-screen setup prompt is shown over a dark launcher background, with three stacked actions and no depicted interaction.
observations:
  - evidence_refs:
      - frame-01
    visible: >-
      The largest visual focus is a light rounded card in the lower half of the portrait screen. It contains the heading 「ホーム画面を整理しますか？」, explanatory Japanese text below it, and three full-width gray buttons labeled 「後で」, 「スキップ」, and 「整理を確認」. Above the card, the dark background includes the heading 「タップでセットアップ」 and two small dots.
    inference: >-
      The card appears to ask whether to organize the home screen and presents the three button labels as the immediate choices. The bottom 「整理を確認」 label appears to be the most task-specific next action, while the other two appear to postpone or bypass the setup prompt.
  - evidence_refs:
      - frame-01
    visible: >-
      The heading and body copy are separated from the buttons by spacing, and the three buttons are grouped vertically inside the same card. The heading and body copy wrap across multiple lines.
    inference: >-
      The likely scan path is heading, explanatory copy, then the three stacked choices.
  - evidence_refs:
      - frame-01
    visible: >-
      The three gray rectangular controls have consistent width and are visually separated by narrow gaps. The top heading and the two dots are visually distinct from the card.
    inference: >-
      The gray rectangles read as tappable controls; the heading, explanatory copy, and dots read as informational rather than interactive elements.
sequence_changes: []
uncertainties:
  - Only frame-01 is available, so no visible change after tapping any action can be observed.
  - The distinction between 「後で」 and 「スキップ」, and whether 「整理を確認」 opens another view or applies anything, cannot be determined from this still image.
