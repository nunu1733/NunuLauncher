findings:
  - id: UVR-001
    category: affordance-action
    observation: >-
      The checklist presents imperative entries, “Open this example address” and
      “Create the example record at,” with blue monospaced values, but no
      separately labeled primary or next-step control is visible in the captured
      viewport.
    evidence_refs:
      - frame-01
    user_impact: >-
      A first-time user may be unsure whether to open, copy, or create from the
      blue values, or simply continue reading, delaying an appropriate next step.
    severity: moderate
    confidence: medium
    recommendation: >-
      Make the intended next action and its priority apparent on the first screen,
      while clearly distinguishing instructional examples from actionable controls.
    additional_validation:
      - >-
        Capture the complete viewport and exercise each apparent action to verify
        its intended behavior and resulting next step.
  - id: UVR-002
    category: scanability-density
    observation: >-
      The second example record path wraps across two lines inside its numbered
      item, with the continuation beginning at the left edge beneath the first
      line.
    evidence_refs:
      - frame-01
    user_impact: >-
      Users trying to understand or transcribe the entry may need to re-read it to
      determine the complete value and endpoint.
    severity: minor
    confidence: high
    recommendation: >-
      Present long example values with an unmistakable continuation and endpoint
      so each entry can be scanned as one complete item.
    additional_validation: []
deterministic_deferrals:
  - surface: functional-state
    visible_symptom: >-
      The blue address, blue path, and mint plus symbol appear visually distinct,
      but the static frame does not establish whether they are interactive or
      copyable.
    required_check: >-
      Exercise the screen and verify the intended interaction, destination, and
      post-action state for each apparent control.
  - surface: clipping
    visible_symptom: >-
      The checklist card continues to the bottom edge of the captured square
      frame, so lower content or controls are not observable.
    required_check: >-
      Verify the full rendered viewport and that all intended guidance and
      controls are visible or reachable.
limitations:
