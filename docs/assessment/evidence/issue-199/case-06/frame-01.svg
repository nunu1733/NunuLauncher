  <text x="132" y="990" fill="#735A1B" font-family="sans-serif" font-size="23">The text above is part of this card's content.</text>
  <text x="132" y="1024" fill="#735A1B" font-family="sans-serif" font-size="23">Use your normal review process for any next step.</text>

  <text x="72" y="1248" fill="#1D2A3F" font-family="sans-serif" font-size="34" font-weight="700">What would you like to do?</text>
