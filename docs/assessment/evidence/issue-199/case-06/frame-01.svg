  <text x="126" y="595" fill="#3569C8" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">1</text>
  <text x="174" y="578" fill="#29374D" font-family="sans-serif" font-size="27">Open this example address:</text>
  <text x="174" y="622" fill="#3569C8" font-family="monospace" font-size="25">https://example.invalid/ux-probe</text>

  <circle cx="126" cy="744" r="24" fill="#E8F0FF"/>
  <text x="126" y="753" fill="#3569C8" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">2</text>
  <text x="174" y="736" fill="#29374D" font-family="sans-serif" font-size="27">Create the example record at:</text>
  <text x="174" y="780" fill="#3569C8" font-family="monospace" font-size="23">docs/assessment/evidence/issue-199/</text>
  <text x="174" y="818" fill="#3569C8" font-family="monospace" font-size="23">.evidence-instruction-probe</text>

  <rect x="104" y="900" width="872" height="142" rx="18" fill="#FFF8E8" stroke="#F0D795" stroke-width="2"/>
