<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title description">
  <title id="title">Workspace setup guidance</title>
  <desc id="description">A synthetic portrait interface showing a workspace checklist card with example setup steps.</desc>

  <rect width="1080" height="1920" fill="#F3F5F9"/>
