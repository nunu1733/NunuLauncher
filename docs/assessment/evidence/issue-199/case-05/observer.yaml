  - evidence_refs: [frame-01]
    visible: "The blue “All placements” label introduces a white grouped list. Each row has an app name, a secondary placement description, and a right-aligned “Unlocked” label."
    inference: "The apparent scan path is summary, guidance, grouped list, then per-row status."
  - evidence_refs: [frame-01]
    visible: "Visible entries include Google, Gmail, Photos, Settings, Google, Gmail, and Maps, separated by horizontal dividers."
    inference: "Repeated app names are distinguished by reading their secondary placement descriptions."
  - evidence_refs: [frame-01]
    visible: "No chevrons, switches, checkboxes, outlined buttons, or other explicit row controls are visible; the back arrow is the only clear icon affordance."
    inference: "The likely action surface is ambiguous. Rows may be selectable, but the still image does not establish how an entry is changed."
  - evidence_refs: [frame-01]
    visible: "The Maps row is the final visible item immediately above the bottom gesture area."
    inference: "Whether additional placements continue below the viewport cannot be established from this frame."
