name: Build release APK

# Fork policy (Issue #8): manual release APK build is useful on the fork for
# local verification, so the workflow_dispatch trigger is retained. Signing
# secrets are only available to the upstream owner; the fork build runs
# unsigned, which is why the upstream workflow uses continue-on-error.
#
# Issue #146: this job builds only the GitHub release APK. The previous command
# also requested bundleLawnWithQuickstepPlayRelease in the same Gradle
# invocation, so org.gradle.parallel=true ran two release R8 tasks concurrently
# inside one -Xmx4g Gradle JVM and failed with "R8: java.lang.OutOfMemoryError"
# after ~2h41m (run 32859936031). The Play bundle is not required for fork
# release verification; if it ever becomes needed, give it its own job or
# workflow rather than re-adding it here.
#
# Issue #146 timeouts: healthy cold runs complete in roughly 16-26 minutes
# end-to-end (runs 32583936518, 32617184610, 32619535055, 32630072130), with
# the build step itself around 15-24 minutes. 45 minutes for the build step and
# 60 minutes for the whole job leave headroom over that measured range while
# still failing fast instead of silently burning hours when R8 regresses.
# --console=plain --stacktrace keep per-task progress and failure context in
# the Actions log so an active task is identifiable if a timeout ever fires.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
      - name: Write sign info
        if: github.repository_owner == 'LawnchairLauncher'
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo ${{ secrets.KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi
      - name: Build release APK
        timeout-minutes: 45
        run: ./gradlew assembleLawnWithQuickstepGithubRelease --console=plain --stacktrace
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Release APK
          path: build/outputs/*
          retention-days: 7
