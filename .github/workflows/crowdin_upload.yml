name: Crowdin Upload

# Fork policy (Issue #8): the upstream `push` trigger uploaded source strings to
# Crowdin on every push to a dev branch. NunuLauncher does not push to Crowdin,
# so the trigger is removed; the job is kept for an explicit manual run on the
# upstream owner only. On this fork the owner guard below ends the workflow
# immediately.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  synchronize-with-crowdin:
    name: Upload strings to Crowdin
    if: github.repository_owner == 'LawnchairLauncher'
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Upload Strings
      uses: crowdin/github-action@v2
      with:
        upload_translations: false
        upload_sources: true
        download_translations: false
        localization_branch_name: 15-dev-localization
        create_pull_request: false
        base_url: 'https://lawnchair.crowdin.com'
      env:
        GITHUB_TOKEN: ${{ secrets.LAWNCHAIR_BOT_TOKEN }}
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
