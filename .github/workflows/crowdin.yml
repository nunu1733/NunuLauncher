name: Crowdin Synchronization

# Fork policy (Issue #8): manual dispatch only, and the job runs solely on the
# upstream owner. NunuLauncher never synchronizes with Crowdin automatically.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:

  synchronize-with-crowdin:
    name: Synchronize with Crowdin
    if: github.repository_owner == 'LawnchairLauncher'
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Sync Translations
      uses: crowdin/github-action@v2
      with:
        upload_translations: false
        upload_sources: true
        download_translations: true
        localization_branch_name: 15-dev-localization
        create_pull_request: true
        base_url: 'https://lawnchair.crowdin.com'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
