name: CI

# Fork-native CI for NunuLauncher.
#
# This workflow supersedes the upstream Lawnchair ci.yml for this fork (see
# Issue #8 for the inventory and keep/disable policy). Differences from upstream:
#   - The Telegram notification, nightly release, and Crowdin auto-merge jobs
#     are removed: they require upstream-only secrets and mutate releases, so
#     they must never run on the fork.
#   - Only assembleLawnWithQuickstepGithubDebug is built; the nightly/play
#     variants are deferred to a dedicated release evaluation Issue.
#   - A validate-repo-contract job runs on every push/PR, including docs-only
#     changes, so broken internal links and invalid Issue forms fail CI.
#   - Permissions are declared per-job at least privilege.
#
# Upstream sync note: when merging a newer Lawnchair revision, reconcile this
# file against the upstream ci.yml deliberately rather than overwriting it.

on:
  push:
    branches:
      - main
      - '*-dev'
  pull_request:
  workflow_dispatch:
  workflow_call:

# Cancel superseded runs on the same ref so fast PR iteration does not queue
# redundant builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Paths filter decides which downstream jobs are worth running. Keeping it in
  # one job lets every later job gate on a single output and avoids re-evaluating
  # path globs in each if-condition.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # The source filter combines a broad include with exclusions. The
          # default `some` would let `**` win by itself, so use v4's explicit
          # include-match-with-no-exclusion predicate.
          predicate-quantifier: some-with-excludes
          filters: |
            source:
              # Treat every non-documentation/tooling path as source. A broad
              # include is intentional: Lawnchair has source-bearing modules
              # outside lawnchair/, quickstep/, and src/.
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!specs/**'
              - '!.github/**'
              - '!tools/repo-contract/**'
              - '!LICENSE*'
              - '!NOTICE*'
            ci:
              # CI configuration must exercise the same source jobs it changes;
              # otherwise workflow-only Pull Requests can skip the very gates
              # whose orchestration and commands they modify.
              - '.github/workflows/**'

  # Always run: the repository contract (internal links, Issue forms, required
  # files) is cheap and must gate every change, including docs-only PRs.
  validate-repo-contract:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The offline patch-surface verifier resolves the accepted upstream/main
      # commits from the checked-out local object database. Keep complete history
      # in this inexpensive gate so a shallow checkout cannot mask that evidence.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install PyYAML for full Issue-form parsing
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.3'
      - name: Validate repository contracts
        run: python3 tools/repo-contract/validate_repo_contract.py
      - name: Validator self-tests
        run: python3 tools/repo-contract/test_validate_repo_contract.py
      - name: High-risk gate self-tests
        run: python3 tools/repo-contract/test_validate_high_risk_evidence.py
      - name: Validate Deck retirement repo contract
        run: python3 tools/repo-contract/test_validate_deck_retirement.py
      - name: Writer inventory scan
        run: python3 tools/repo-contract/validate_writer_inventory.py
      - name: Upstream patch-surface measurement self-tests
        run: python3 tools/repo-contract/test_measure_upstream_patch_surface.py
      - name: Reproduce accepted upstream patch-surface baseline
        run: python3 tools/repo-contract/measure_upstream_patch_surface.py --verify
      - name: Validate diagnostics contract (AC-67-12)
        run: python3 tools/repo-contract/validate_diagnostics_contract.py
      - name: Diagnostics contract self-tests
        run: python3 tools/repo-contract/test_validate_diagnostics_contract.py

  # Source-only: style check. Skipped for docs-only PRs so they do not spin up
  # a Gradle daemon.
  check-style:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew spotlessCheck

  # Source-only: build the GitHub Debug APK. This is the one variant the fork
  # validates on every source PR; release/nightly variants belong to a future
  # release-evaluation Issue, not to per-PR CI.
  build-debug-apk:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build GitHub Debug APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: assembleLawnWithQuickstepGithubDebug
          path: build/outputs/apk/**/*.apk
          retention-days: 7

  # Source-only: run the organizer JVM unit/contract/property suite. The
  # --tests filter covers app.lawnchair.organizer.planning.* and the pure
  # application tests, so new tests under that package tree join this gate
  # automatically. The preference navigation retention tests (Issue #116) are
  # listed explicitly. The focused real-adapter instrumentation seam is
  # verified independently below on an emulator.
  organizer-unit-tests:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run organizer unit tests
        run: ./gradlew testLawnWithQuickstepGithubDebugUnitTest --tests 'app.lawnchair.organizer.*' --tests 'app.lawnchair.ui.preferences.navigation.*'
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-unit-test-reports
          # AGP writes HTML reports under build/reports/tests/<task>/ and JUnit
          # XML under build/test-results/<task>/; there is no classes/ level.
          path: |
            build/reports/tests/testLawnWithQuickstepGithubDebugUnitTest/**
            build/test-results/testLawnWithQuickstepGithubDebugUnitTest/**/*.xml
          retention-days: 7
          if-no-files-found: error

  # Keep each focused suite in an independent emulator job. This preserves the
  # clean-state evidence required by Issues #52/#53 while removing the former
  # serial critical path; the jobs start together after the shared changes gate.
  #
  # Shared-writer / coordinator seam lane: the Issue #113 MODEL_WRITER
  # self-deadlock regression and the lease admission/FIFO/Binder suites run
  # permanently here on their own clean API 36 emulator. They exercise the
  # model DB write seam only (isolated fixture DBs) and stay independent from
  # the app-state-heavy UI lanes below.
  organizer-instrumentation-shared-writer-tests:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run shared-writer coordinator instrumentation (API 36 / Platform 36.1)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: >-
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.android.launcher3.organizer.ModelWriterTransactionReentryTest,com.android.launcher3.organizer.LayoutWriteCoordinatorTest,com.android.launcher3.organizer.BinderOperationFutureTest
      - name: Upload shared-writer instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-instrumentation-shared-writer-reports
          path: |
            build/reports/androidTests/connected/**
            build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn

  # DB migration transaction-ownership lane: the Issue #118 schema
  # upgrade/downgrade failure-semantics suites run permanently here on their own
  # clean API 36 emulator. #115 showed these suites were compile-only while
  # carrying real production-semantics regressions; they use isolated fixture
  # DBs and stay independent from the app-state-heavy UI lanes.
  organizer-instrumentation-db-migration-tests:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run DB migration ownership instrumentation (API 36 / Platform 36.1)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: >-
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.android.launcher3.organizer.MigrationTransactionOwnershipTest,com.android.launcher3.organizer.DatabaseHelperSchema33Test,com.android.launcher3.organizer.DowngradeSchema33Test,com.android.launcher3.organizer.InactiveGridDbNormalizationTest,com.android.launcher3.organizer.rollback32.Schema32RollbackBinaryTest
      - name: Upload DB migration instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-instrumentation-db-migration-reports
          path: |
            build/reports/androidTests/connected/**
            build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn

  organizer-instrumentation-api35-tests:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Issue 83 production seam instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.organizer.integration.ProductionOrganizationInputInstrumentationTest,app.lawnchair.organizer.rules.CategoryOverrideAtomicFileInstrumentationTest
            ./gradlew installLawnWithQuickstepGithubDebug installLawnWithQuickstepGithubDebugAndroidTest
            adb shell am force-stop app.lawnchair.debug.test
            adb shell am force-stop app.lawnchair.debug
            adb shell am instrument -w -r -e class app.lawnchair.organizer.rules.CategoryOverrideAtomicFileRestartWriterInstrumentationTest app.lawnchair.debug.test/app.lawnchair.migration.DeckRetirementTestRunner | tee /tmp/category-override-restart-writer.txt
            grep -q 'OK (1 test)' /tmp/category-override-restart-writer.txt
            grep -q 'INSTRUMENTATION_CODE: -1' /tmp/category-override-restart-writer.txt
            adb shell am force-stop app.lawnchair.debug.test
            adb shell am force-stop app.lawnchair.debug
            adb shell am instrument -w -r -e class app.lawnchair.organizer.rules.CategoryOverrideAtomicFileRestartReaderInstrumentationTest app.lawnchair.debug.test/app.lawnchair.migration.DeckRetirementTestRunner | tee /tmp/category-override-restart-reader.txt
            grep -q 'OK (1 test)' /tmp/category-override-restart-reader.txt
            grep -q 'INSTRUMENTATION_CODE: -1' /tmp/category-override-restart-reader.txt
      - name: Upload API 35 instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-instrumentation-api35-reports
          path: |
            build/reports/androidTests/connected/**
            build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn

  # Issue #52 owns database-heavy fixtures and layout-data evidence. It receives
  # a dedicated clean API 36 emulator rather than sharing target state or an
  # instrumentation process with the onboarding suite.
  organizer-instrumentation-issue52-tests:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Issue 52 manual organization instrumentation (API 36 / Platform 36.1)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.organizer.ui.ManualOrganizationProductionE2EInstrumentationTest,app.lawnchair.organizer.ui.ManualOrganizationPreferencesInstrumentationTest
            mkdir -p build/issue52-ui-evidence
            adb pull /sdcard/Pictures/Issue52-ui-evidence build/issue52-ui-evidence
      - name: Upload Issue 52 instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-instrumentation-issue52-reports
          path: |
            build/reports/androidTests/connected/**
            build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn
      - name: Upload Issue 52 UI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue52-ui-evidence
          path: build/issue52-ui-evidence/**
          retention-days: 7
          if-no-files-found: warn

  # Issue #99 owns profile-safe authoring UI evidence. It runs on an independent
  # clean emulator so semantics, focus, font-scale, and mutation interactions are
  # verified rather than only compiled alongside the other Organizer suites.
  organizer-instrumentation-issue99-tests:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Issue 99 category override instrumentation (API 36 / Platform 36.1)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: >-
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.organizer.ui.CategoryOverridePreferencesInstrumentationTest
      - name: Upload Issue 99 instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-instrumentation-issue99-reports
          path: |
            build/reports/androidTests/connected/**
            build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn

  # Issue #53 needs a fresh API 36 Launcher process and persistent state so the
  # proposal lifecycle, accessibility, recreation, and review-admission tests
  # remain independent from the database-heavy Issue #52 fixture.
  organizer-instrumentation-issue53-tests:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Issue 53 onboarding proposal instrumentation (API 36 / Platform 36.1)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: >-
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.organizer.ui.OnboardingOrganizationProposalInstrumentationTest
      - name: Upload Issue 53 instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-instrumentation-issue53-reports
          path: |
            build/reports/androidTests/connected/**
            build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn

  # Required status check: aggregates the jobs above so branch protection has a
  # single gate. Jobs that were skipped (e.g. style on a docs PR) count as
  # success; only actual failures fail the gate.
  final-status:
    needs:
      - changes
      - validate-repo-contract
      - check-style
      - organizer-unit-tests
      - organizer-instrumentation-shared-writer-tests
      - organizer-instrumentation-db-migration-tests
      - organizer-instrumentation-api35-tests
      - organizer-instrumentation-issue52-tests
      - organizer-instrumentation-issue99-tests
      - organizer-instrumentation-issue53-tests
      - build-debug-apk
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check required jobs
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs completed successfully."
