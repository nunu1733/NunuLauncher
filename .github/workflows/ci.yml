name: CI

# Fork-native CI for NunuLauncher.
#
# This workflow supersedes the upstream Lawnchair ci.yml for this fork (see
# Issue #8 for the inventory and keep/disable policy). Differences from upstream:
#   - The Telegram notification, nightly release, and Crowdin auto-merge jobs
#     are removed: they require upstream-only secrets and mutate releases, so
#     they must never run on the fork.
#   - Only assembleLawnWithQuickstepGithubDebug is built; the nightly/play
#     variants are deferred to a dedicated release evaluation Issue.
#   - A validate-repo-contract job runs on every push/PR, including docs-only
#     changes, so broken internal links and invalid Issue forms fail CI.
#   - Permissions are declared per-job at least privilege.
#
# Upstream sync note: when merging a newer Lawnchair revision, reconcile this
# file against the upstream ci.yml deliberately rather than overwriting it.

on:
  push:
    branches:
      - main
      - '*-dev'
  pull_request:
  workflow_dispatch:
  workflow_call:

# Cancel superseded runs on the same ref so fast PR iteration does not queue
# redundant builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Paths filter decides which downstream jobs are worth running. Keeping it in
  # one job lets every later job gate on a single output and avoids re-evaluating
  # path globs in each if-condition.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # The source filter combines a broad include with exclusions. The
          # default `some` would let `**` win by itself, so use v4's explicit
          # include-match-with-no-exclusion predicate.
          predicate-quantifier: some-with-excludes
          filters: |
            source:
              # Treat every non-documentation/tooling path as source. A broad
              # include is intentional: Lawnchair has source-bearing modules
              # outside lawnchair/, quickstep/, and src/.
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!specs/**'
              - '!.github/**'
              - '!tools/repo-contract/**'
              - '!LICENSE*'
              - '!NOTICE*'

  # Always run: the repository contract (internal links, Issue forms, required
  # files) is cheap and must gate every change, including docs-only PRs.
  validate-repo-contract:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install PyYAML for full Issue-form parsing
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.3'
      - name: Validate repository contracts
        run: python3 tools/repo-contract/validate_repo_contract.py
      - name: Validator self-tests
        run: python3 tools/repo-contract/test_validate_repo_contract.py
      - name: High-risk gate self-tests
        run: python3 tools/repo-contract/test_validate_high_risk_evidence.py
      - name: Validate Deck retirement repo contract
        run: python3 tools/repo-contract/test_validate_deck_retirement.py
      - name: Writer inventory scan
        run: python3 tools/repo-contract/validate_writer_inventory.py
      - name: Validate diagnostics contract (AC-67-12)
        run: python3 tools/repo-contract/validate_diagnostics_contract.py
      - name: Diagnostics contract self-tests
        run: python3 tools/repo-contract/test_validate_diagnostics_contract.py

  # Source-only: style check. Skipped for docs-only PRs so they do not spin up
  # a Gradle daemon.
  check-style:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew spotlessCheck

  # Source-only: build the GitHub Debug APK. This is the one variant the fork
  # validates on every source PR; release/nightly variants belong to a future
  # release-evaluation Issue, not to per-PR CI.
  build-debug-apk:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build GitHub Debug APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: assembleLawnWithQuickstepGithubDebug
          path: build/outputs/apk/**/*.apk
          retention-days: 7

  # Source-only: run the organizer JVM unit/contract/property suite. The
  # --tests filter covers app.lawnchair.organizer.planning.* and the pure
  # application tests, so new tests under that package tree join this gate
  # automatically. The focused real-adapter instrumentation seam is verified
  # independently below on an emulator.
  organizer-unit-tests:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run organizer unit tests
        run: ./gradlew testLawnWithQuickstepGithubDebugUnitTest --tests 'app.lawnchair.organizer.*'
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-unit-test-reports
          # AGP writes HTML reports under build/reports/tests/<task>/ and JUnit
          # XML under build/test-results/<task>/; there is no classes/ level.
          path: |
            build/reports/tests/testLawnWithQuickstepGithubDebugUnitTest/**
            build/test-results/testLawnWithQuickstepGithubDebugUnitTest/**/*.xml
          retention-days: 7
          if-no-files-found: error

  # Focused Android instrumentation evidence for the production OrganizationInput
  # seam. This keeps real-adapter capture, profile isolation, availability/lock,
  # and no-write rejection evidence executable instead of documenting it only.
  organizer-instrumentation-tests:
    needs: changes
    if: ${{ needs.changes.outputs.source == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Issue 83 production seam instrumentation
        if: ${{ false }} # Temporary PR #95 focused diagnosis; restore before merge.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: >-
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.organizer.integration.ProductionOrganizationInputInstrumentationTest
      # API 36 system images are the emulator counterpart of the repository's
      # Android SDK Platform 36.1 validation baseline. The Issue #52 tests own
      # database-heavy fixture state, so run their reused review/E2E coverage in
      # a clean API 36 emulator rather than sharing an instrumentation process
      # with the onboarding suite.
      - name: Run Issue 52 manual organization instrumentation (API 36 / Platform 36.1)
        if: ${{ false }} # Temporary PR #95 focused diagnosis; restore before merge.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.organizer.ui.ManualOrganizationProductionE2EInstrumentationTest,app.lawnchair.organizer.ui.ManualOrganizationPreferencesInstrumentationTest
            mkdir -p build/issue52-ui-evidence
            adb pull /sdcard/Pictures/Issue52-ui-evidence build/issue52-ui-evidence
      - name: Run Issue 53 onboarding proposal instrumentation (API 36 / Platform 36.1)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: >-
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.organizer.ui.OnboardingOrganizationProposalInstrumentationTest#productionOwnerDefersBindWhilePausedThenShowsAndRoutesReviewAfterResume
      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-instrumentation-reports
          path: |
            build/reports/androidTests/connected/**
            build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn
      - name: Upload Issue 52 UI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue52-ui-evidence
          path: build/issue52-ui-evidence/**
          retention-days: 7
          if-no-files-found: warn

  # Required status check: aggregates the jobs above so branch protection has a
  # single gate. Jobs that were skipped (e.g. style on a docs PR) count as
  # success; only actual failures fail the gate.
  final-status:
    needs:
      - changes
      - validate-repo-contract
      - check-style
      - organizer-unit-tests
      - organizer-instrumentation-tests
      - build-debug-apk
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check required jobs
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs completed successfully."
