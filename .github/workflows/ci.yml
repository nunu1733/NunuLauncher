name: CI

# Fork-native CI for NunuLauncher.
#
# This workflow supersedes the upstream Lawnchair ci.yml for this fork (see
# Issue #8 for the inventory and keep/disable policy). Differences from upstream:
#   - The Telegram notification, nightly release, and Crowdin auto-merge jobs
#     are removed: they require upstream-only secrets and mutate releases, so
#     they must never run on the fork.
#   - Only assembleLawnWithQuickstepGithubDebug is built; the nightly/play
#     variants are deferred to a dedicated release evaluation Issue.
#   - A validate-repo-contract job runs on every push/PR, including docs-only
#     changes, so broken internal links and invalid Issue forms fail CI.
#   - Permissions are declared per-job at least privilege.
#
# Portfolio model (Issue #422, specs/422-impact-based-ci-portfolio):
#   - validate-repo-contract runs on every event (docs-only included).
#   - Permanent source gates (style / build / unit) run on `permanent_run`
#     (source || ci || full || smoke).
#   - Instrumentation lanes are conditional: a lane runs when
#     `instrumentation_enabled && (full || own surface)` per the lane<->surface
#     map in tools/repo-contract/ci_portfolio_map.yml (the normative edge
#     source; docs/engineering/ci-test-portfolio.md is the human-readable
#     mirror). The `changes` job applies the per-path fail-closed rule: one
#     unmapped source file anywhere in the diff forces the full portfolio.
#   - main pushes, the weekly schedule, workflow_call, and
#     workflow_dispatch(full-portfolio=true) run the full portfolio regardless
#     of paths. workflow_dispatch(full-portfolio=false) is a deterministic
#     smoke: permanent gates on, every instrumentation lane off.
#
# Upstream sync note: when merging a newer Lawnchair revision, reconcile this
# file against the upstream ci.yml deliberately rather than overwriting it.

on:
  push:
    branches:
      - main
      - '*-dev'
  pull_request:
  schedule:
    - cron: '30 19 * * 0'
  workflow_dispatch:
    inputs:
      full-portfolio:
        description: 'Run the full lane portfolio regardless of changed paths'
        type: boolean
        default: true
  workflow_call:

# Cancel superseded runs on the same ref so fast PR iteration does not queue
# redundant builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Paths filter decides which downstream jobs are worth running. Keeping it in
  # one job lets every later job gate on a single output and avoids re-evaluating
  # path globs in each if-condition. The filter only evaluates diffs for
  # pull_request/push events; schedule, workflow_call, and workflow_dispatch
  # runs force their behavior through the gate step and never read mapping
  # outputs, so a non-PR event can never mis-gate a lane through paths-filter.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
      ci: ${{ steps.filter.outputs.ci }}
      permanent_run: ${{ steps.gate.outputs.permanent_run }}
      instrumentation_enabled: ${{ steps.gate.outputs.instrumentation_enabled }}
      full: ${{ steps.gate.outputs.full }}
      surface_layout_write: ${{ steps.filter.outputs.surface_layout_write }}
      surface_db_schema: ${{ steps.filter.outputs.surface_db_schema }}
      surface_backup_restore: ${{ steps.filter.outputs.surface_backup_restore }}
      surface_production_input: ${{ steps.filter.outputs.surface_production_input }}
      surface_organizer_ui: ${{ steps.filter.outputs.surface_organizer_ui }}
      surface_jvm: ${{ steps.filter.outputs.surface_jvm }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          # The source filter combines a broad include with exclusions. The
          # default `some` would let `**` win by itself, so use v4's explicit
          # include-match-with-no-exclusion predicate. Surface filters carry no
          # excludes, so the quantifier behaves like `some` for them.
          predicate-quantifier: some-with-excludes
          # File lists travel as JSON arrays through env into
          # tools/ci/compute_ci_gating.py; no GitHub expression is interpolated
          # into a shell, and filenames with spaces/quotes/metacharacters stay
          # intact (dorny/paths-filter#notes treats *_files as untrusted).
          list-files: json
          filters: |
            source:
              # Treat every non-documentation/tooling path as source. A broad
              # include is intentional: Lawnchair has source-bearing modules
              # outside lawnchair/, quickstep/, and src/.
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!specs/**'
              - '!.github/**'
              - '!tools/repo-contract/**'
              - '!LICENSE*'
              - '!NOTICE*'
            ci:
              # CI configuration must exercise the same source jobs it changes;
              # otherwise workflow-only Pull Requests can skip the very gates
              # whose orchestration and commands they modify.
              - '.github/workflows/**'
            surface_layout_write:
              # Layout write coordinator / ModelWriter / DB controller seam and
              # the organizer application module that drives apply + recovery.
              # Test paths use directory granularity and deliberately
              # over-trigger neighbouring lanes (safe direction) instead of
              # maintaining a second per-class list that can drift.
              - 'src/com/android/launcher3/model/LayoutWriteCoordinator.java'
              - 'src/com/android/launcher3/model/ModelWriter.java'
              - 'src/com/android/launcher3/model/ModelDbController.java'
              - 'lawnchair/src/app/lawnchair/organizer/application/**'
              - 'tests/organizer-instrumentation/com/android/launcher3/organizer/**'
              - 'tests/organizer-instrumentation/com/android/launcher3/OrganizerReloadCompletionOrderingTest.java'
              - 'tests/organizer-instrumentation/com/android/launcher3/hybridhotseat/**'
              - 'tests/organizer-instrumentation/app/lawnchair/organizer/application/**'
              - 'tests/organizer-instrumentation/app/lawnchair/organizer/planning/**'
            surface_db_schema:
              # LauncherProvider / schema upgrade / grid migration ownership and
              # the Deck retirement startup migration. The four schema test
              # files are listed explicitly: they live under the broad
              # com/.../organizer/ glob owned by surface_layout_write, and the
              # db-migration lane must self-trigger when its own tests change
              # (overlap with surface_layout_write is the safe direction).
              - 'src/com/android/launcher3/provider/**'
              - 'src/com/android/launcher3/model/DatabaseHelper.java'
              - 'src/com/android/launcher3/model/GridSizeMigrationUtil.java'
              - 'lawnchair/src/app/lawnchair/migration/**'
              - 'tests/organizer-instrumentation/com/android/launcher3/organizer/MigrationTransactionOwnershipTest.java'
              - 'tests/organizer-instrumentation/com/android/launcher3/organizer/DatabaseHelperSchema33Test.java'
              - 'tests/organizer-instrumentation/com/android/launcher3/organizer/DowngradeSchema33Test.java'
              - 'tests/organizer-instrumentation/com/android/launcher3/organizer/InactiveGridDbNormalizationTest.java'
              - 'tests/organizer-instrumentation/com/android/launcher3/organizer/rollback32/**'
              - 'tests/organizer-instrumentation/com/android/launcher3/model/**'
              - 'tests/organizer-instrumentation/app/lawnchair/migration/**'
            surface_backup_restore:
              # Old-backup restore capture (Nova) and the backup agent seam.
              - 'lawnchair/src/app/lawnchair/backup/**'
              - 'src/com/android/launcher3/LauncherBackupAgent.java'
              - 'tests/organizer-instrumentation/app/lawnchair/backup/**'
            surface_production_input:
              # Production organization input composer / platform evidence
              # adapters (API 35 + 36 compatibility) and the category override
              # atomic-file contract that needs a real framework filesystem.
              - 'lawnchair/src/app/lawnchair/organizer/integration/**'
              - 'tests/organizer-instrumentation/app/lawnchair/organizer/integration/**'
              - 'tests/organizer-instrumentation/app/lawnchair/organizer/rules/**'
            surface_organizer_ui:
              # Organizer UI group: manual organization, onboarding proposal,
              # category override authoring, exchange import, and the shared
              # Compose preferences surface. v1 intentionally groups these four
              # lanes (screen-level split is a later refinement).
              - 'lawnchair/src/app/lawnchair/organizer/ui/**'
              - 'lawnchair/src/app/lawnchair/organizer/*'
              - 'lawnchair/src/app/lawnchair/ui/**'
              - 'lawnchair/src/app/lawnchair/organizer/personalization/**'
              - 'lawnchair/res/**'
              - 'tests/organizer-instrumentation/app/lawnchair/organizer/ui/**'
              - 'tests/organizer-instrumentation/app/lawnchair/ui/preferences/**'
            surface_jvm:
              # Surfaces whose regression oracle is the JVM unit/contract/property
              # gate (planner corpus, rules, diagnostics, locks) plus the JVM
              # test tree itself. No instrumentation lane consumes this surface;
              # it exists so these paths count as mapped for the per-path
              # fail-closed rule.
              - 'lawnchair/src/app/lawnchair/organizer/planning/**'
              - 'lawnchair/src/app/lawnchair/organizer/rules/**'
              - 'lawnchair/src/app/lawnchair/organizer/diagnostics/**'
              - 'lawnchair/src/app/lawnchair/organizer/locks/**'
              - 'tests/unit/**'
      - name: Compute portfolio gating (Issue #422)
        id: gate
        # Applies the per-path fail-closed rule (one unmapped source file in
        # the diff forces the full portfolio) and the smoke/full event
        # semantics. Inputs travel through env only; see the script header.
        env:
          GATING_EVENT: ${{ github.event_name }}
          GATING_REF: ${{ github.ref }}
          GATING_FULL_PORTFOLIO: ${{ inputs.full-portfolio }}
          GATING_WORKFLOW_CALL: ${{ github.event_name == 'workflow_call' }}
          GATING_SOURCE: ${{ steps.filter.outputs.source }}
          GATING_CI: ${{ steps.filter.outputs.ci }}
          GATING_SOURCE_FILES: ${{ steps.filter.outputs.source_files }}
          GATING_SURFACE_LAYOUT_WRITE_FILES: ${{ steps.filter.outputs.surface_layout_write_files }}
          GATING_SURFACE_DB_SCHEMA_FILES: ${{ steps.filter.outputs.surface_db_schema_files }}
          GATING_SURFACE_BACKUP_RESTORE_FILES: ${{ steps.filter.outputs.surface_backup_restore_files }}
          GATING_SURFACE_PRODUCTION_INPUT_FILES: ${{ steps.filter.outputs.surface_production_input_files }}
          GATING_SURFACE_ORGANIZER_UI_FILES: ${{ steps.filter.outputs.surface_organizer_ui_files }}
          GATING_SURFACE_JVM_FILES: ${{ steps.filter.outputs.surface_jvm_files }}
        run: python3 tools/ci/compute_ci_gating.py

  # Always run: the repository contract (internal links, Issue forms, required
  # files, CI portfolio consistency) is cheap and must gate every change,
  # including docs-only PRs.
  validate-repo-contract:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The offline patch-surface verifier resolves the accepted upstream/main
      # commits from the checked-out local object database. Keep complete history
      # in this inexpensive gate so a shallow checkout cannot mask that evidence.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install PyYAML for full Issue-form parsing
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.3'
      - name: Validate repository contracts
        run: python3 tools/repo-contract/validate_repo_contract.py
      - name: Validator self-tests
        run: python3 tools/repo-contract/test_validate_repo_contract.py
      - name: Test emulator failure evidence capture helper
        run: bash tools/ci/test_capture_emulator_failure_evidence.sh
      - name: High-risk gate self-tests
        run: python3 tools/repo-contract/test_validate_high_risk_evidence.py
      - name: Validate Deck retirement repo contract
        run: python3 tools/repo-contract/test_validate_deck_retirement.py
      - name: Writer inventory scan
        run: python3 tools/repo-contract/validate_writer_inventory.py
      - name: Upstream patch-surface measurement self-tests
        run: python3 tools/repo-contract/test_measure_upstream_patch_surface.py
      - name: Reproduce accepted upstream patch-surface baseline
        run: python3 tools/repo-contract/measure_upstream_patch_surface.py --verify
      - name: Validate diagnostics contract (AC-67-12)
        run: python3 tools/repo-contract/validate_diagnostics_contract.py
      - name: Diagnostics contract self-tests
        run: python3 tools/repo-contract/test_validate_diagnostics_contract.py
      - name: CI portfolio validator (Issue #422)
        run: python3 tools/repo-contract/validate_ci_portfolio.py
      - name: CI portfolio validator self-tests
        run: python3 tools/repo-contract/test_validate_ci_portfolio.py
      - name: CI gating computation self-tests (Issue #422)
        run: python3 tools/ci/test_compute_ci_gating.py

  # Permanent source gate: style check. Runs on permanent_run
  # (source || ci || full || smoke); skipped for docs-only PRs so they do not
  # spin up a Gradle daemon.
  check-style:
    needs: changes
    if: needs.changes.outputs.permanent_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew spotlessCheck

  # Permanent source gate: build the GitHub Debug APK. This is the one variant
  # the fork validates on every source PR; release/nightly variants belong to a
  # future release-evaluation Issue, not to per-PR CI.
  build-debug-apk:
    needs: changes
    if: needs.changes.outputs.permanent_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build GitHub Debug APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: assembleLawnWithQuickstepGithubDebug
          path: build/outputs/apk/**/*.apk
          retention-days: 7

  # Permanent source gate: run the organizer JVM unit/contract/property suite.
  # The --tests filter covers app.lawnchair.organizer.* and the pure application
  # tests, so new tests under that package tree join this gate automatically.
  # The preference navigation retention tests (Issue #116), bugreport (Issue
  # #242), and backup unit tests are listed explicitly. The focused real-adapter
  # instrumentation seam is verified independently below on emulators.
  organizer-unit-tests:
    needs: changes
    if: needs.changes.outputs.permanent_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run organizer unit tests
        run: ./gradlew testLawnWithQuickstepGithubDebugUnitTest --tests 'app.lawnchair.organizer.*' --tests 'app.lawnchair.ui.preferences.navigation.*' --tests 'app.lawnchair.bugreport.*' --tests 'app.lawnchair.backup.*'
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-unit-test-reports
          # AGP writes HTML reports under build/reports/tests/<task>/ and JUnit
          # XML under build/test-results/<task>/; there is no classes/ level.
          path: |
            build/reports/tests/testLawnWithQuickstepGithubDebugUnitTest/**
            build/test-results/testLawnWithQuickstepGithubDebugUnitTest/**/*.xml
          retention-days: 7
          if-no-files-found: error

  # Keep each focused suite in an independent emulator job. This preserves the
  # clean-state evidence required by Issues #52/#53 while removing the former
  # serial critical path; the jobs start together after the shared changes gate.
  #
  # Shared-writer / coordinator seam lane: the Issue #113 MODEL_WRITER
  # self-deadlock regression, lease admission/FIFO/Binder suites, the whole-unit
  # nested SQLiteTransaction contract, Issue #119 reload-supersession suite, and
  # Issue #156 Hotseat atomic-admission race suite run permanently here on their
  # own clean API 36 emulator. Coordinator and transaction cases use isolated
  # fixture DBs; the reload case uses the real Launcher model but stays
  # independent from the UI lanes below. Issue #422 renamed the lane IDs to the
  # contract they own; lane<->surface gating comes from ci_portfolio_map.yml.
  organizer-instrumentation-shared-writer-tests:
    needs: changes
    if: >-
      needs.changes.outputs.instrumentation_enabled == 'true' &&
      (needs.changes.outputs.full == 'true' ||
       needs.changes.outputs.surface_layout_write == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run shared-writer coordinator instrumentation (API 36 / Platform 36.1)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: >-
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.android.launcher3.organizer.ModelWriterTransactionReentryTest,com.android.launcher3.organizer.LayoutWriteCoordinatorTest,com.android.launcher3.organizer.BinderOperationFutureTest,com.android.launcher3.organizer.NestedTransactionTest,com.android.launcher3.OrganizerReloadCompletionOrderingTest,com.android.launcher3.organizer.OrganizerReloadSupersessionTest,com.android.launcher3.organizer.RestoreLeaseSerializationTest,com.android.launcher3.organizer.RestoreLeaseDeferredLoaderThreadAffinityTest,com.android.launcher3.hybridhotseat.HotseatRestoreAdmissionTest
      - name: Upload shared-writer instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-instrumentation-shared-writer-reports
          path: |
            build/reports/androidTests/connected/**
            build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn
      - name: Capture shared-writer failure-time emulator evidence
        if: failure()
        continue-on-error: true
        # Issue #315: the helper is bounded internally (per-command timeout and
        # a 150s budget); this step-level timeout is the absolute backstop so a
        # wedged capture can never consume the job budget before the upload.
        run: timeout --kill-after=30 300 bash tools/ci/capture-emulator-failure-evidence.sh emulator-5554 build/shared-writer-failure-time-evidence
      - name: Upload shared-writer failure-time emulator evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: shared-writer-failure-time-emulator-evidence
          path: build/shared-writer-failure-time-evidence/**
          retention-days: 14
          if-no-files-found: warn

  # DB migration transaction-ownership lane: the Issue #118 schema
  # upgrade/downgrade failure-semantics suites run permanently here on their own
  # clean API 36 emulator. #115 showed these suites were compile-only while
  # carrying real production-semantics regressions; they use isolated fixture
  # DBs and stay independent from the app-state-heavy UI lanes.
  organizer-instrumentation-db-migration-tests:
    needs: changes
    if: >-
      needs.changes.outputs.instrumentation_enabled == 'true' &&
      (needs.changes.outputs.full == 'true' ||
       needs.changes.outputs.surface_db_schema == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run DB migration ownership instrumentation (API 36 / Platform 36.1)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: >-
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.android.launcher3.organizer.MigrationTransactionOwnershipTest,com.android.launcher3.organizer.DatabaseHelperSchema33Test,com.android.launcher3.organizer.DowngradeSchema33Test,com.android.launcher3.organizer.InactiveGridDbNormalizationTest,com.android.launcher3.organizer.rollback32.Schema32RollbackBinaryTest
      - name: Upload DB migration instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: organizer-instrumentation-db-migration-reports
          path: |
            build/reports/androidTests/connected/**
            build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn
      - name: Capture DB migration failure-time emulator evidence
        if: failure()
        continue-on-error: true
        run: timeout --kill-after=30 300 bash tools/ci/capture-emulator-failure-evidence.sh emulator-5554 build/db-migration-failure-time-evidence
      - name: Upload DB migration failure-time emulator evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: db-migration-failure-time-emulator-evidence
          path: build/db-migration-failure-time-evidence/**
          retention-days: 14
          if-no-files-found: warn

  # Nova restore -> Organizer capture regression lane (ex Issue #299 lane).
  # Each scenario class runs in its OWN `am instrument` invocation: the
  # cross-process pair (Stage A commits the sanitized restored DB after its
  # completion barrier settles the correlated reload; Stage B reads it
  # read-only before model init) requires a fresh process per stage, and the
  # single-restore-per-process contract keeps reload generations from
  # overlapping. Verify the procedure note in
  # docs/assessment/issue-299-nova-restore-capture-invalid.md before changing.
  organizer-instrumentation-restore-capture-tests:
    needs: changes
    if: >-
      needs.changes.outputs.instrumentation_enabled == 'true' &&
      (needs.changes.outputs.full == 'true' ||
       needs.changes.outputs.surface_backup_restore == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Nova restore capture instrumentation (API 36 / Platform 36.1)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.backup.NovaRestoreCaptureControlTest
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.backup.NovaRestoreCaptureWidgetWindowTest
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.backup.NovaRestoreCaptureUnknownProviderTest
            ./gradlew connectedLawnWithQuickstepGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.backup.NovaRestoreCaptureNoCallbacksTest
            # Gradle uninstalls both APKs (wiping app data) after each connected
            # run, so the cross-process pair installs them manually and drives
            # the two stages with `am instrument` + force-stop: stage A restores
            # (its completion barrier settles the repair before return), the
            # force-stop is the process death, and stage B must observe the
            # persisted repaired DB in a fresh process before any model reload
            # runs.
            ./gradlew assembleLawnWithQuickstepGithubDebug assembleLawnWithQuickstepGithubDebugAndroidTest
            adb install -r -d build/outputs/apk/lawnWithQuickstepGithub/debug/*.apk
            adb install -r build/outputs/apk/androidTest/lawnWithQuickstepGithub/debug/*.apk
            adb shell am instrument -w -e class app.lawnchair.backup.NovaRestoreCaptureCrossProcessStageATest app.lawnchair.debug.test/app.lawnchair.migration.DeckRetirementTestRunner
            adb shell am force-stop app.lawnchair.debug
            adb shell am instrument -w -e class app.lawnchair.backup.NovaRestoreCaptureCrossProcessStageBTest app.lawnchair.debug.test/app.lawnchair.migration.DeckRetirementTestRunner
      - name: Upload restore-capture instrumentation reports on failure
