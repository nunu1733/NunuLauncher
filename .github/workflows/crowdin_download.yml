name: Crowdin Download

# Fork policy (Issue #8): the weekly schedule is retained for the upstream
# owner. The job-level owner guard already prevents execution on NunuLauncher;
# keeping the schedule avoids a diff churn that would complicate upstream sync,
# and the guard is the authoritative control.

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:

  synchronize-with-crowdin:
    name: Download translations from Crowdin
    if: github.repository_owner == 'LawnchairLauncher'
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Download translations
      uses: crowdin/github-action@v2
      with:
        upload_translations: false
        upload_sources: false
        download_translations: true
        localization_branch_name: 15-dev-localization
        create_pull_request: true
        base_url: 'https://lawnchair.crowdin.com'
      env:
        GITHUB_TOKEN: ${{ secrets.LAWNCHAIR_BOT_TOKEN }}
        CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
